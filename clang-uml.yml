# All generated .puml files go here
output_directory: docs/uml

# Shared settings applied to all diagrams
glob:
  - src/lib/**/*.cpp
  - src/platform/posix/**/*.cpp
  - include/fujinet/**/*.h

using_namespace:
  - fujinet

diagrams:
  gen_core_io:
    type: class
    filter_mode: advanced    # <— important

    include:
      anyof:
        namespaces:
          - fujinet::core
          - fujinet::io
        elements:
          - fujinet::fs::StorageManager

    exclude:
      namespaces:
        - fujinet::io::protocol

    plantuml:
      before:
        - "title Core + IO (auto-gen from clang-uml)"

  gen_core_io_sequence:
    type: sequence
    filter_mode: advanced

    from:
      - function: fujinet::io::IOService::serviceOnce()

    include:
      anyof:
        namespaces:
          - fujinet::io
          - fujinet::core
        elements:
          - fujinet::fs::StorageManager
          - fujinet::io::IODeviceManager
          - fujinet::io::VirtualDevice

    plantuml:
      before:
        - "title Core I/O request flow (IOService tick)"
        - "caption IOService::serviceOnce() – transports → handler"

  gen_core_device_sequence:
    type: sequence
    filter_mode: advanced
    generate_return_types: true
    generate_return_values: true
    generate_condition_statements: true
    generate_method_arguments: full

    from:
      - function: fujinet::io::IODeviceManager::handleRequest(const IORequest &)

    include:
      anyof:
        namespaces:
          - fujinet::io
        elements:
          - fujinet::io::IOResponse
          - fujinet::io::IORequest

    plantuml:
      before:
        - "title Device dispatch flow (IODeviceManager)"
        - "caption IODeviceManager::handleRequest() – device lookup → VirtualDevice::handle()"


  gen_fs:
    type: class
    include:
      namespaces:
        - fujinet::fs
    plantuml:
      before:
        - "title Filesystem (auto-gen from clang-uml)"

  gen_config:
    type: class
    include:
      namespaces:
        - fujinet::config
    plantuml:
      before:
        - "title Config (auto-gen from clang-uml)"

  gen_io_protocol:
    type: class
    include:
      namespaces:
        - fujinet::io::protocol
    plantuml:
      before:
        - "title IO Protocols (auto-gen from clang-uml)"

  gen_build_support:
    type: class
    include:
      namespaces:
        - fujinet::build
    plantuml:
      before:
        - "title Build Support (auto-gen from clang-uml)"

  gen_core_spider:
    type: class

    include:
      context:
        - match:
            pattern: fujinet::core::FujinetCore
            radius: 4              # tweak 2–4 as needed
            direction: any         # both “out” and “in”
            relationships:         # only relationships we care about
              - composition
              - aggregation
              - association
              - ownership
              - dependency         # adds method/arg/return-use too

    exclude:
      namespaces:
        - std

    using_namespace:
      - fujinet

    plantuml:
      before:
        - "title FujinetCore dependency spider (auto-gen from clang-uml)"

  # ---------------------------------------------------------------------------
  # Overviews. These are selected by relationship ("everything that implements
  # X"), so they follow the code and need no hand editing; members are hidden to
  # keep them readable. Only ESP32-free code is parsed (the POSIX build), so
  # ESP32-only classes do not appear.
  # ---------------------------------------------------------------------------

  gen_core_layers:
    type: class
    include:
      context:
        - match: {pattern: fujinet::io::IOService, radius: 1, direction: any, relationships: [inheritance, composition, aggregation, association]}
        - match: {pattern: fujinet::io::RoutingManager, radius: 1, direction: any, relationships: [inheritance, composition, aggregation, association]}
        - match: {pattern: fujinet::io::IODeviceManager, radius: 1, direction: any, relationships: [inheritance, composition, aggregation, association]}
    exclude:
      namespaces:
        - std
      access: [public, protected, private]
    plantuml:
      before:
        - "title Core layers: how a request flows through the core"

  gen_core_tick_sequence:
    type: sequence
    from:
      - function: "fujinet::core::FujinetCore::tick()"
    exclude:
      namespaces:
        - std
    plantuml:
      before:
        - "title One core tick: transports in, requests routed, devices polled"

  gen_transports:
    type: class
    include:
      subclasses:
        - fujinet::io::ITransport
        - fujinet::io::IFramer
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Transports and framers"

  gen_channels:
    type: class
    include:
      subclasses:
        - fujinet::io::Channel
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Channels: the byte pipes under the transports (POSIX build)"

  gen_devices:
    type: class
    include:
      subclasses:
        - fujinet::io::VirtualDevice
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Devices and services (VirtualDevice implementations)"

  gen_work_sources:
    type: class
    include:
      subclasses:
        - fujinet::io::IWorkSource
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Work sources: what can wake the core loop"

  gen_atari_ingress:
    type: class
    include:
      context:
        - match: {pattern: fujinet::platform::posix::AtariNetSioIngress, radius: 2, direction: any, relationships: [inheritance, composition, aggregation, association]}
        - match: {pattern: fujinet::io::AtariSioIngressRouter, radius: 2, direction: any, relationships: [inheritance, composition, aggregation, association]}
    exclude:
      namespaces:
        - std
      access: [public, protected, private]
    plantuml:
      before:
        - "title Atari SIO/NetSIO ingress (POSIX): router and frontends"

  gen_disk_images:
    type: class
    include:
      subclasses:
        - fujinet::disk::IDiskImage
        - fujinet::disk::IImageProbe
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Disk image formats and format probes"

  gen_network_protocols:
    type: class
    include:
      subclasses:
        - fujinet::io::INetworkProtocol
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Network protocol backends"

  gen_filesystems:
    type: class
    include:
      subclasses:
        - fujinet::fs::IFileSystem
    exclude:
      namespaces:
        - std
      access: [public, protected, private]   # names and relationships only
    plantuml:
      before:
        - "title Filesystems"
