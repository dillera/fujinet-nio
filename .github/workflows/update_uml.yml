name: Publish UML diagrams

# The generated (gen_*) diagrams are built from the code on every push to
# master that touches it, and published to GitHub Pages. They are not
# committed: the job only publishes when the build and the unit tests pass.
# Hand-authored diagrams (arch_*, seq_*) stay in docs/ and are rendered with
# `scripts/gen_uml.sh --render-docs`.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'clang-uml.yml'
      - 'scripts/gen_uml.sh'
      - '.github/workflows/update_uml.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# One publish at a time; a newer push supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Forks have no Pages site of ours to publish to.
    if: github.repository == 'markjfisher/fujinet-nio'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:bkryza/clang-uml
          sudo apt-get update
          sudo apt-get install -y \
            clang-uml \
            plantuml \
            graphviz \
            cmake \
            ninja-build \
            build-essential

      # Builds, runs the unit tests (a failure stops the job, so nothing is
      # published from a tree that does not build or pass), then generates.
      - name: Generate UML diagrams
        run: |
          chmod +x scripts/gen_uml.sh
          ./scripts/gen_uml.sh

      - name: Assemble the site
        run: |
          mkdir -p site/uml
          cp docs/images/gen_*.svg site/uml/
          {
            echo '<!doctype html><meta charset="utf-8"><title>fujinet-nio diagrams</title>'
            echo '<h1>fujinet-nio generated diagrams</h1>'
            echo "<p>Built from <code>${GITHUB_SHA::8}</code> on $(date -u +%Y-%m-%d).</p><ul>"
            for f in site/uml/*.svg; do
              n=$(basename "$f"); echo "<li><a href=\"uml/$n\">$n</a></li>"
            done
            echo '</ul>'
          } > site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
